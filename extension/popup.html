<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能收藏</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body><header><h1>收藏之前，先找对位置。</h1><a href="index.html" target="_blank">整理与设置 ↗</a></header><label>网页标题<input id="title" maxlength="500"></label><p id="url"></p><label>收藏范围<select id="root"></select></label><section><strong id="suggestion">正在读取当前网页…</strong><p id="reason" role="status"></p></section><label>保存位置<select id="folder"></select></label><details><summary>AI 配置 · 仅当前浏览器会话</summary><p>只发送公开网页的标题、域名和现有文件夹名称。私人链接在本地判断。</p><label>从本地文件载入配置<input id="config" type="file" accept=".env,.txt"></label><label><input id="consent" type="checkbox">同意发送到配置的模型服务商，可能产生 API 费用</label><button id="configure">启用 AI 并重新推荐</button></details><button id="save" disabled>确认收藏</button><p id="status" role="status"></p><div id="saved" hidden><button id="open">打开文件夹</button><button id="undo">撤销本次收藏</button></div><small>关闭弹窗前无需收藏；只有点击“确认收藏”才会写入。</small></body></html>
